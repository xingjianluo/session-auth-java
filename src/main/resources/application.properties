spring.application.name=session-auth-java

# 会话认证与访问控制配置
auth.security.session-ttl=30m
auth.security.max-concurrent-sessions=2
auth.security.max-failed-attempts=3
auth.security.lock-duration=5m
auth.security.rate-limit-window=1m
auth.security.rate-limit-max-attempts=5
auth.security.public-paths=/api/public/**,/api/auth/login
auth.security.csrf-enabled=true
auth.security.allowed-origins=http://localhost:3000

logging.level.com.github.xingjianluo.sessionauthjava=INFO
