# Session settings
app.security.session.idle-timeout-millis=1800000
app.security.session.cookie-name=SID
app.security.session.cookie-path=/
app.security.session.cookie-http-only=true
app.security.session.cookie-same-site=Lax
app.security.session.cookie-secure=false

# Login throttling / locking / concurrency
app.security.login.max-sessions-per-user=2
app.security.login.lock-threshold=5
app.security.login.lock-millis=300000
app.security.login.rate-limit-attempts=10
app.security.login.rate-limit-window-millis=60000
app.security.login.rate-limit-block-millis=60000

# CSRF
app.security.csrf.enabled=true
app.security.csrf.header-name=X-CSRF-TOKEN

# CORS
app.security.cors.enabled=true
app.security.cors.allowed-origin-pattern=*
app.security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.security.cors.allow-credentials=true

# Static security headers
app.security.headers.frame-options=DENY
app.security.headers.content-type-options=nosniff
app.security.headers.referrer-policy=no-referrer
app.security.headers.content-security-policy=default-src 'self'

# Fail when a bound property cannot map, keeping config changes reproducible/explicit
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

logging.level.com.github.xingjianluo=INFO
logging.level.AUTHZ_AUDIT=INFO
